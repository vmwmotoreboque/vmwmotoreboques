<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Painel Administrativo | VMW Moto-Reboques
</title>

<link rel="stylesheet"
href="css/admin.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="login">

<div class="login-box">

<img src="imagens/logo.png"
class="logo"
alt="VMW">

<h2>

Painel Administrativo

</h2>

<p>

VMW Moto-Reboques

</p>

<input
type="password"
id="senha"
placeholder="Digite sua senha">

<button
id="entrar">

Entrar

</button>

<p
id="erro">

Senha incorreta

</p>

</div>

</div>

<div
class="painel"
id="painel">

<header>

<h1>

VMW Moto-Reboques

</h1>

<button
id="sair">

Sair

</button>

</header>

<section
class="card">

<h2>

📍 Localização Atual

</h2>

<p>

Cidade:

<span
id="cidade">

Não definida

</span>

</p>

<p>

Latitude:

<span
id="lat">

--

</span>

</p>

<p>

Longitude:

<span
id="lon">

--

</span>

</p>

<button
id="atualizarLocalizacao">

Atualizar localização

</button>

</section>
<section class="card">

<h2>

💰 Tabela de Preços

</h2>

<label>

Até 20 km

</label>

<input
type="number"
id="ate20"
value="120">

<label>

Valor por km
(20 a 40 km)

</label>

<input
type="number"
id="km20a40"
value="2">

<label>

Valor base
(acima de 40 km)

</label>

<input
type="number"
id="base40"
value="150">

<label>

Valor por km
(acima de 40 km)

</label>

<input
type="number"
id="kmAcima40"
value="2.5">

<button
id="salvar">

Salvar Configurações

</button>

</section>

<section
class="card">

<h2>

📊 Status

</h2>

<p>

Sistema:

<span
class="online">

● Online

</span>

</p>

<p>

Geoapify:

<span
id="statusGeo">

Conectado

</span>

</p>

<p>

Cloudflare:

<span
id="statusCloud">

Conectado

</span>

</p>

</section>

<script src="js/admin.js"></script>

</div>

</body>

</html>
